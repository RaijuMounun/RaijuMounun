<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
            .text { font-family: 'JetBrains Mono', monospace; fill: #f8f8f2; font-size: 16px; opacity: 0; animation: fade 1s forwards; }
            .quote { font-family: 'JetBrains Mono', monospace; fill: #6272a4; font-size: 32px; font-weight: 700; opacity: 0; animation: fade 1s forwards; }
            .highlight-purple { fill: #bd93f9; font-weight: 700; }
            .highlight-pink { fill: #ff79c6; font-weight: 700; }
            .highlight-cyan { fill: #8be9fd; font-weight: 700; }
            
            .d1 { animation-delay: 0.3s; }
            .d2 { animation-delay: 0.6s; }
            .d3 { animation-delay: 0.9s; }
            .d4 { animation-delay: 1.2s; }

            @keyframes fade {
                to { opacity: 1; }
            }
        </style>
    </defs>

    <rect width="100%" height="100%" fill="#282a36" rx="15" ry="15" />

    <g transform="translate(40, 50)">
        <text x="0" y="0" class="quote d1">"</text>
        <text x="30" y="-5" class="text d1">I don't just write code; I <tspan class="highlight-purple">design systems</tspan>.</text>
        
        <text x="30" y="30" class="text d2">My focus is on building <tspan class="highlight-pink">robust</tspan>, <tspan class="highlight-pink">scalable</tspan>, and <tspan class="highlight-pink">maintainable</tspan></text>
        <text x="30" y="55" class="text d2">cross-platform solutions (Game Dev, Web, Mobile, Desktop).</text>
        
        <text x="30" y="95" class="text d3">Because frameworks are temporary,</text>
        <text x="30" y="120" class="text d4">but <tspan class="highlight-cyan">architecture is timeless</tspan>.</text>
    </g>
</svg>
